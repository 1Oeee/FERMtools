# Bygger store-paketet på varje push till main, och publicerar till Chrome
# Web Store av sig själv när versionen i manifest.json är ny.
#
# Så släpps en version: höj "version" i manifest.json, lägg en post överst i
# CHANGELOG.md och pusha till main. Finns ingen tagg v<version> ännu laddas
# paketet upp och skickas till granskning; efter Googles godkännande går det
# ut till användarna. Taggen och GitHub-releasen skapas först när
# uppladdningen lyckats — misslyckas den försöker nästa push igen.
#
# Kräver (Settings → Secrets and variables → Actions):
#   secrets.CWS_SERVICE_ACCOUNT_JSON  nyckel-JSON för servicekontot
#   vars.CWS_PUBLISHER_ID             utgivar-ID från Developer Dashboard
#   vars.CWS_EXTENSION_ID             tilläggets ID i Chrome Web Store
#
# Valfritt: vars.CWS_UPLOAD_ONLY = true laddar upp paketet som utkast utan att
# skicka det till granskning, och skapar ingen tagg. Behövs när en version
# lägger till en behörighet: butiken visar fältet för dess motivering först när
# ett paket med behörigheten laddats upp. Fyll i motiveringen, ta bort
# variabeln och kör om arbetsflödet — då skickas versionen och taggas.

name: Release

on:
  push:
    branches: [main]
  # Kör om för hand, t.ex. när en uppladdning föll på att förra versionen
  # fortfarande låg i granskning.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.released.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera version
        id: check
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest.json: $version"

          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error file=manifest.json::Chrome kräver 1–4 heltal med punkter, fick '$version'"
            exit 1
          fi

          changelog=$(grep -m1 -oP '^## \K[0-9.]+' CHANGELOG.md)
          if [[ "$changelog" != "$version" ]]; then
            echo "::error file=CHANGELOG.md::Översta posten är $changelog, manifest.json säger $version"
            exit 1
          fi

          if [[ $(jq '.icons["128"] // empty' manifest.json) == "" ]]; then
            echo "::warning file=manifest.json::Ingen 128px-ikon i manifest.json — Chrome Web Store kräver en"
          fi

      - name: Är versionen redan släppt?
        id: released
        # Taggen v<version> skapas när en uppladdning lyckats. Finns den är
        # versionen redan ute (eller i granskning) — då byggs bara paketet.
        run: |
          version="${{ steps.check.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version finns redan — ingen publicering."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version är ny — publiceras till Chrome Web Store."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tester
        run: node tests/run.mjs

      - name: Bygg paket
        # Bara det tillägget laddar. spike/ och Projekt tree/ hör inte hemma i butiken.
        # tests/ följer med eftersom inställningarna länkar dit — men inte Node-skripten.
        #
        # Filerna läggs upp som de är, inte som en zip. GitHub zippar alltid en
        # artefakt vid nedladdning; laddades vår zip upp blev det en zip i en
        # zip. Nu är det GitHub-zippen som är paketet: packa upp och ladda in,
        # eller skicka till butiken. publish-jobbet zippar en gång, själv.
        run: |
          mkdir -p dist/package
          cp -r manifest.json managed_schema.json src tests dist/package/
          [[ -d icons ]] && cp -r icons dist/package/
          find dist/package/tests -name '*.mjs' -delete
          (cd dist/package && find . -type f | sort)

      - uses: actions/upload-artifact@v4
        with:
          name: inuplus-${{ steps.check.outputs.version }}
          path: dist/package/
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && needs.package.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    # Två versioner får aldrig laddas upp samtidigt.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    env:
      ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      API: https://chromewebstore.googleapis.com
    steps:
      - name: Kontrollera uppsättningen
        env:
          HAS_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON != '' }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=()
          [[ "$HAS_KEY" == "true" ]] || missing+=("secret CWS_SERVICE_ACCOUNT_JSON")
          [[ -n "$PUBLISHER" ]] || missing+=("variable CWS_PUBLISHER_ID")
          [[ -n "$EXTENSION" ]] || missing+=("variable CWS_EXTENSION_ID")
          if (( ${#missing[@]} )); then
            echo "::error::Chrome Web Store är inte uppsatt — saknas: ${missing[*]} (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: inuplus-${{ needs.package.outputs.version }}
          path: package

      - name: Zippa paketet
        # Den enda zippningen: manifest.json ska ligga överst i zippen.
        run: |
          cd package
          zip -r -X "../inuplus-${{ needs.package.outputs.version }}.zip" .
          unzip -l "../inuplus-${{ needs.package.outputs.version }}.zip" | head -5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Ladda upp
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          res=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"inuplus-${{ needs.package.outputs.version }}.zip" \
            "$API/upload/v2/$ITEM:upload")
          echo "$res" | jq .

          state=$(echo "$res" | jq -r .uploadState)
          for i in $(seq 1 30); do
            [[ "$state" != "IN_PROGRESS" ]] && break
            sleep 10
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
              "$API/v2/$ITEM:fetchStatus" | tee /dev/stderr | jq -r '.lastAsyncUploadState // .uploadState')
          done

          if [[ "$state" != "SUCCEEDED" ]]; then
            echo "::error::Uppladdningen slutade i läget $state"
            exit 1
          fi

      - name: Bara uppladdning
        if: vars.CWS_UPLOAD_ONLY == 'true'
        run: |
          {
            echo "### Uppladdad som utkast — inte skickad till granskning"
            echo "CWS_UPLOAD_ONLY är satt. Fyll i det som saknas i Developer Dashboard"
            echo "(t.ex. motiveringen för en ny behörighet under Integritet), ta bort"
            echo "variabeln och kör om arbetsflödet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skicka till granskning
        if: vars.CWS_UPLOAD_ONLY != 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        # DEFAULT_PUBLISH: går ut till användarna så fort Google godkänt.
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "$API/v2/$ITEM:publish" | tee publish.json | jq .
          echo "Läge hos Chrome Web Store: $(jq -r '.state // "okänt"' publish.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub-release
        if: vars.CWS_UPLOAD_ONLY != 'true'
        # Skapar taggen v<version> på den här committen — beviset på att
        # versionen är uppladdad, så att nästa push inte laddar upp den igen.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Inu+ ${{ needs.package.outputs.version }}
          files: inuplus-${{ needs.package.outputs.version }}.zip
          generate_release_notes: true
