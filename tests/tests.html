<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Unit tests – group tree</title>
    <style>
      :root {
        color-scheme: light dark;
        --ok: #107c10;
        --bad: #a4262c;
        --muted: #888;
      }
      body {
        margin: 0;
        padding: 20px;
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
        max-width: 780px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      #summary {
        padding: 10px 12px;
        border: 1px solid;
        border-radius: 6px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      #summary.ok {
        color: var(--ok);
        border-color: var(--ok);
      }
      #summary.bad {
        color: var(--bad);
        border-color: var(--bad);
      }
      .t {
        display: flex;
        gap: 10px;
        padding: 5px 0;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      }
      .t .m {
        flex: 0 0 14px;
        font-weight: 700;
      }
      .t.ok .m {
        color: var(--ok);
      }
      .t.bad .m {
        color: var(--bad);
      }
      .t .why {
        color: var(--bad);
        font-size: 13px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Unit tests – tree building, markers and palette</h1>
    <p class="sub">Pure functions — no network and no tenant needed.</p>
    <div id="summary">Running …</div>
    <div id="list"></div>

    <script type="module">
      import { runAll } from "./tree.test.js";
      // Importeras för sina biverkningar: filen registrerar sina tester i
      // samma ram när den laddas.
      import "./theme.test.js";
      import "./demo.test.js";
      import "./health.test.js";

      const list = document.getElementById("list");
      const summary = document.getElementById("summary");

      function report({ name, ok, error }) {
        const row = document.createElement("div");
        row.className = `t ${ok ? "ok" : "bad"}`;

        const mark = document.createElement("div");
        mark.className = "m";
        mark.textContent = ok ? "✓" : "✗";

        const body = document.createElement("div");
        body.append(Object.assign(document.createElement("div"), { textContent: name }));
        if (!ok) {
          body.append(
            Object.assign(document.createElement("div"), {
              className: "why",
              textContent: error
            })
          );
        }

        row.append(mark, body);
        list.append(row);
      }

      const { passed, total } = await runAll(report);
      summary.className = passed === total ? "ok" : "bad";
      summary.textContent =
        passed === total
          ? `All ${total} tests green.`
          : `${total - passed} of ${total} tests failed.`;
    </script>
  </body>
</html>
