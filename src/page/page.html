<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inu+</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <header>
      <div class="titlerow">
        <h1 class="brand">Inu+</h1>
        <span class="brand-sub">Groups, assignments and connections</span>
        <div class="actions">
          <button id="refresh" type="button" class="icon" title="Refresh">⟳</button>
          <button id="detach" type="button" class="icon" title="Open in its own tab">⧉</button>
          <button id="settings" type="button" class="icon" title="Settings">⚙</button>
          <button id="close" type="button" class="icon" title="Close and show the portal" hidden>✕</button>
        </div>
      </div>

      <div id="tokens" class="tokenbar"></div>

      <div id="notices"></div>
      <div id="status" hidden></div>

      <!-- Tabs last: their underline should meet the edge of the content,
           just like in the portal's own blades. -->
      <nav id="tabs" class="tabs" role="tablist"></nav>
    </header>

    <main id="module"></main>

    <footer id="footer"></footer>

    <script type="module" src="page.js"></script>
  </body>
</html>
